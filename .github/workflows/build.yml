name: Build

on:
  workflow_dispatch:

env:
  VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d

defaults:
  run:
    shell: bash

jobs:
  dependency_graph:
    name: Populate dependency graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg
          git -C vcpkg checkout "$VCPKG_COMMIT"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Write dependency graph
        if: ${{ runner.os == 'linux' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCPKG_FEATURE_FLAGS: dependencygraph
        run: ./vcpkg/vcpkg install --dry-run --debug

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Build SDist
        run: uv build --sdist --no-progress --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: ./dist/*.tar.gz

  build_wheels:
    name: Build wheels
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            mono: "mono"
            nuget: "`./vcpkg/vcpkg fetch nuget | tail -n 1`"
            # Cibuildwheel containers mount the host filesystem at /host
          - os: macos-latest
            mono: ""
            nuget: "nuget"
          - os: windows-latest
            mono: ""
            nuget: "nuget"
    runs-on: ${{ matrix.os }}
    env:
      NUGET_FEED_URL: https://nuget.pkg.github.com/abhinavnatarajan/index.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "recursive"

      - name: Setup build tools (macos)
        if: ${{ runner.os == 'macos' }}
        run: |
          brew install automake autoconf autoconf-archive libtool nuget

      - name: Setup build tools (linux)
        if: ${{ runner.os == 'linux' }}
        run: |
          sudo apt-get install mono-complete -y

      - name: Set deployment target (macos)
        if: ${{ runner.os == 'macos' }}
        run: echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d '.' -f 1-2)" >> "$GITHUB_ENV"

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg
          git -C vcpkg checkout "$VCPKG_COMMIT"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Setup vcpkg binary cache
        run: >
          ${{ matrix.mono }} ${{ matrix.nuget }}
          sources add
          -Name GithubPackages
          -Source "${{ env.NUGET_FEED_URL }}"
          -UserName "${{ github.repository_owner }}"
          -Password "${{ secrets.GH_PACKAGES_TOKEN }}"
          -StorePasswordInClearText

          ${{ matrix.mono }} ${{ matrix.nuget }}
          setapikey "${{ secrets.GH_PACKAGES_TOKEN }}"
          -Source "${{ env.NUGET_FEED_URL }}"

          echo "VCPKG_BINARY_SOURCES=clear;nuget,GithubPackages,readwrite" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: ${{ runner.os == 'macos' || runner.os == 'windows' }}

      - name: Build wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        env:
          CIBW_ARCHS: auto64
          # Poorly documented: Nuget feed API keys are stored in encrypted form
          # but can only be decoded on the same machine, which breaks inside
          # the cibuildwheel container. We need to set the API key again inside the
          # container.
          CIBW_BEFORE_ALL_LINUX: |
            dnf install mono-complete curl zip unzip tar autoconf autoconf-archive automake libtool -y
            ./vcpkg/bootstrap-vcpkg.sh
            mkdir -p $HOME/.config/NuGet
            cp /host/home/runner/.config/NuGet/NuGet.Config $HOME/.config/NuGet/NuGet.Config
            ${{ matrix.mono }} ${{ matrix.nuget }} \
            setapikey "${{ secrets.GH_PACKAGES_TOKEN }}" \
            -Source "${{ env.NUGET_FEED_URL }}"
          CIBW_BUILD_FRONTEND: build[uv]
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT_PASS_LINUX: CI VCPKG_BINARY_SOURCES
          CIBW_SKIP: pp* *-musllinux_*
          CIBW_TEST_COMMAND: pytest {package}/tests
          CIBW_TEST_GROUPS: test

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  merge_artifacts:
    name: Merge wheel artifacts
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels
          pattern: wheels-*
          delete-merged: true
