[project]
name = "chalc"
version = "14.2.0"
authors = [{ name = "Abhinav Natarajan", email = "natarajan@maths.ox.ac.uk" }]
description = "Persistent homology of chromatic Delaunay filtrations"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
keywords = [
  "TDA",
  "chromatic Delaunay",
  "computational geometry",
  "computational topology",
  "persistent homology",
  "topological data analysis",
]
dependencies = [
  "h5py~=3.12",
  "matplotlib~=3.9",
  "numpy~=2.0",
  "pandas~=2.2",
  "phimaker~=0.3.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Documentation = "https://abhinavnatarajan.github.io/Chalc"
Homepage = "https://abhinavnatarajan.github.io/Chalc"
Repository = "https://github.com/abhinavnatarajan/Chalc.git"

[dependency-groups]
dev = [
  "chromatic-tda~=1.1",
  "furo>=2024.8.6",
  "ipykernel~=6.29",
  "ipympl~=0.9",
  "ipython~=8.29",
  "jupyterlab~=4.4",
  "nbsphinx~=0.9",
  # Pybind11 headers for LSP
  # Needs to be kept in sync with build-system.requires below
  "pybind11~=2.13",
  "pybind11-stubgen~=2.5",
  "sphinx~=8.2",
  "sphinx-autoapi~=3.3",
  "sphinx-design~=0.6",
  "sphinx-toolbox~=3.5",
  "tqdm>=4.67.1",
]
test = ["gudhi~=3.11", "pytest~=8.3"]

[build-system]
requires = ["pybind11~=2.13", "scikit-build-core~=0.11.4"]
build-backend = "scikit_build_core.build"

[tool.pyrefly]
preset = "default"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
indent-style = "tab"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # General
  "CPY",  # flake8-copyright/missing-copyright-notice: requires cpyright notices within each Python file
  "ERA",  # eradicate: disallows commented code
  "W191",  # pycodestyle/tab-indentation: disallows tab indentation
  "D206",  # pydocstyle/docstring-tab-indentation: disallows tab indentation in docstring
  "E111",  # pycodestyle/indentation-with-invalid-multiple: forces indentation to be a multiple of 4 spaces
  "E114",  # pycodestyle/indentation-with-invalid-multiple-comment: same as above for comments
  "E117",  # pycodestyle/over-indented: disallows more than 4 spaces of indentation
  "D203",  # pydocstyle/incorrect-blank-line-before-class: requires blank line before class docstring
  "PLR0913",  # pylint/too-many-arguments: too many arguments in function signature
  "PYI021",  # flake8-pyi/docstring-in-stub: disallows docstrings in stub files (not good for extension modules)
  "TD003",  # flake8-todos/missing-todo-link: disallows todos without an issue link
  "ANN401",  # flake8-annotations/any-type: disallows type 'Any' in function signatures
  "ANN003",  # flake8-annotations/missing-type-kwargs: disallows missing types for keyword args dictionary
  "FIX002",  # flake8-fixme/line-contains-todo: checks for TODO comments
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = true

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
  "S101",  # flake8-bandit: disallows use of assert statements
  "PLR2004",  # pylint: disallows magic values
  "INP001",  # pylint: test folder does not need __init__.py
  "D",  # pydocstyle: tests do not need docs
]
"**/__init__.py" = [
  "F401",  # pyflakes: disallows unused imports
  "F403",  # pyflakes: disallows wildcard imports
]
"**.pyi" = ["ALL"]
"docs/**.py" = [
  "INP001",  # pylint: docs folder does not need __init__.py
  "D",  # pydocstyle: doc setup files do not need docs
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build.verbose = true
# cmake.build-type = "Debug"
cmake.build-type = "Release"
cmake.define = { VCPKG_BUILD_TYPE = "Release" }
logging.level = "DEBUG"
build-dir = "build/{wheel_tag}"
sdist.exclude = [
  ".github/",
  ".git/",
  ".clang-format",
  ".editorconfig",
  ".gitignore",
  "hooks/",
]
wheel.packages = ["src/chalc"]
wheel.install-dir = "chalc"
experimental = true
